aid: zeromark
name: ZeroMark
description: >-
  ZeroMark is a defense-technology company building an AI-powered targeting system for
  counter-drone (counter-UAS) defense. Its bolt-on hardware and software components attach to
  existing weapons, platforms, and sensing systems to detect, track, and neutralize small
  drone threats in milliseconds while minimizing collateral damage. The product line spans
  Apex (AI aim-assist for shoulder-mounted rifles), Vanguard (a precision system for
  turret-mounted and vehicle platforms effective against Group 1-3 drones), and Nexus (a
  command-and-control software layer that integrates deployments into shared targeting and
  battlespace-awareness environments). ZeroMark was surfaced as a portfolio company of a16z
  and added to the API Evangelist network. As of this enrichment pass the company publishes
  no public API, SDK, developer documentation, or open-source presence; its Nexus C2
  integration is delivered through defense procurement rather than a public developer program.
